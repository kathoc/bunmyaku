[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlangbase"
version = "0.1.0"
description = "Reproducible local Japanese corpus statistics"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
morphology = ["SudachiPy", "SudachiDict-core"]
dev = ["pytest>=8"]

[project.scripts]
jlangbase = "jlangbase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jlangbase = ["resources/*.json", "resources/*.md", "resources/natural-japanese/*.md", "resources/natural-japanese/*.json", "resources/natural-japanese/references/*.md", "resources/natural-japanese/references/doctypes/*.md", "resources/natural-japanese/assets/*.md", "resources/natural-japanese/scripts/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
